# Speckit compatibility pipeline.
#
# GitHub Actions is the active pipeline for this repository. This file keeps
# the Speckit corpus portable to a GitLab mirror and satisfies its project
# baseline. It does not claim platform-support evidence; the pinned Linux/macOS
# GitHub matrix is the release gate. Do not add a container image; GitLab
# runners own their toolchains.

stages:
  - lint
  - test
  - validate
  - release

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

lint:
  stage: lint
  before_script:
    - cargo fetch --locked
  script:
    - make lint

test:
  stage: test
  before_script:
    - cargo fetch --locked
  script:
    - make test

validate:
  stage: validate
  before_script:
    - cargo fetch --locked
  script:
    - make check

supply_chain:
  stage: validate
  before_script:
    - cargo fetch --locked
    - . security/supply-chain-tools.env
    - cargo install --locked --version "$CARGO_DENY_VERSION" cargo-deny
    - cargo install --locked --version "$CARGO_CYCLONEDX_VERSION" cargo-cyclonedx
  script:
    - make supply-chain-ci
  artifacts:
    name: "cyclonedx-sbom-$CI_COMMIT_SHA"
    paths:
      - target/sbom/*.cdx.json
    expire_in: 14 days

release:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "Releasing $CI_COMMIT_TAG"
  release:
    tag_name: '$CI_COMMIT_TAG'
    description: 'Automated release for $CI_COMMIT_TAG'
