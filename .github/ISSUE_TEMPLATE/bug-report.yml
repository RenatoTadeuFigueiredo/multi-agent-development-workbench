name: Bug report
description: Report reproducible incorrect behavior.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not include credentials, provider tokens, private source code, or personal data.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the observed problem and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Workbench version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true

  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options:
        - Zed via ACP
        - Terminal TUI
        - Headless CLI
        - JetBrains via ACP
        - VS Code adapter
        - Not interface-specific
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include operating system, architecture, relevant agent, and sanitized configuration.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or evidence
      description: Redact secrets and private repository content before attaching logs or screenshots.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed credentials, tokens, private source code, and personal data.
          required: true
        - label: This is not a security vulnerability.
          required: true
