asyncapi: 3.0.0
info:
  title: Workbench Local Client Protocol
  version: 1.0.0
  description: >-
    Same-user, newline-framed JSON protocol used by headless clients and future
    presentation adapters to control one local Workbench daemon.
defaultContentType: application/json
servers:
  local:
    host: localhost
    protocol: workbench-ipc
    description: Unix domain socket owned by the current macOS or Linux user.
channels:
  clientCommands:
    address: workbench.client.commands
    messages:
      command:
        $ref: '#/components/messages/ClientCommand'
  serverReplies:
    address: workbench.server.replies
    messages:
      reply:
        $ref: '#/components/messages/ServerReply'
  sessionEvents:
    address: workbench.session.events
    messages:
      event:
        $ref: '#/components/messages/SessionEvent'
operations:
  sendCommand:
    action: send
    channel:
      $ref: '#/channels/clientCommands'
  receiveReply:
    action: receive
    channel:
      $ref: '#/channels/serverReplies'
  receiveSessionEvent:
    action: receive
    channel:
      $ref: '#/channels/sessionEvents'
components:
  messages:
    ClientCommand:
      name: ClientCommand
      payload:
        $ref: '#/components/schemas/ClientCommand'
    ServerReply:
      name: ServerReply
      payload:
        $ref: '#/components/schemas/ServerReply'
    SessionEvent:
      name: SessionEvent
      payload:
        $ref: '#/components/schemas/SessionEvent'
  schemas:
    ClientCommand:
      type: object
      additionalProperties: false
      required:
        - protocol
        - request_id
        - method
        - params
      properties:
        protocol:
          const: workbench/1
        request_id:
          type: string
          format: uuid
        method:
          enum:
            - initialize
            - status.get
            - session.list
            - session.create
            - session.get
            - session.attach
            - session.prompt
            - session.pause
            - session.resume
            - session.redirect
            - session.cancel
            - session.approval.resolve
            - session.reconcile
            - session.export
            - session.delete
        session_id:
          type: string
          format: uuid
        params:
          anyOf:
            - $ref: '#/components/schemas/InitializeParams'
            - $ref: '#/components/schemas/ListSessionsParams'
            - $ref: '#/components/schemas/CreateSessionParams'
            - $ref: '#/components/schemas/AttachSessionParams'
            - $ref: '#/components/schemas/PromptParams'
            - $ref: '#/components/schemas/EmptyParams'
            - $ref: '#/components/schemas/RedirectParams'
            - $ref: '#/components/schemas/ApprovalParams'
            - $ref: '#/components/schemas/Reconciliation'
            - $ref: '#/components/schemas/ExportParams'
            - $ref: '#/components/schemas/DeleteParams'
      allOf:
        - if:
            properties:
              method:
                enum:
                  - initialize
                  - status.get
                  - session.list
                  - session.create
            required:
              - method
          then:
            not:
              required:
                - session_id
          else:
            required:
              - session_id
    ServerReply:
      type: object
      additionalProperties: false
      required:
        - protocol
        - request_id
        - ok
      properties:
        protocol:
          const: workbench/1
        request_id:
          type: string
          format: uuid
        ok:
          type: boolean
        result:
          oneOf:
            - $ref: '#/components/schemas/InitializeResult'
            - $ref: '#/components/schemas/StatusResult'
            - $ref: '#/components/schemas/ListSessionsResult'
            - $ref: '#/components/schemas/CreateSessionResult'
            - $ref: '#/components/schemas/SessionStateResult'
            - $ref: '#/components/schemas/AttachSessionResult'
            - $ref: '#/components/schemas/PromptResult'
            - $ref: '#/components/schemas/ControlResult'
            - $ref: '#/components/schemas/ApprovalResult'
            - $ref: '#/components/schemas/ReconciliationResult'
            - $ref: '#/components/schemas/ExportResult'
            - $ref: '#/components/schemas/DeleteResult'
        error:
          $ref: '#/components/schemas/ProtocolError'
      allOf:
        - if:
            properties:
              ok:
                const: true
            required:
              - ok
          then:
            required:
              - result
            not:
              required:
                - error
          else:
            required:
              - error
            not:
              required:
                - result
    InitializeResult:
      type: object
      additionalProperties: false
      required:
        - selected_protocol
        - max_frame_bytes
        - max_client_queue_events
        - max_client_queue_bytes
      properties:
        selected_protocol:
          const: workbench/1
        max_frame_bytes:
          const: 8388608
        max_client_queue_events:
          const: 1024
        max_client_queue_bytes:
          const: 8388608
    StatusResult:
      type: object
      additionalProperties: false
      required:
        - daemon_version
        - protocol
        - storage_schema_version
        - key_store
        - migration
        - active_sessions
        - adapters
      properties:
        daemon_version:
          type: string
          minLength: 1
          maxLength: 64
        protocol:
          const: workbench/1
        storage_schema_version:
          type: integer
          minimum: 1
        key_store:
          enum:
            - available
            - locked
            - unavailable
        migration:
          enum:
            - ready
            - failed
        active_sessions:
          type: integer
          minimum: 0
        adapters:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - status
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 128
              status:
                enum:
                  - available
                  - unavailable
    CreateSessionResult:
      type: object
      additionalProperties: false
      required:
        - session_id
        - configuration_hash
        - lock_hash
        - state
      properties:
        session_id:
          type: string
          format: uuid
        configuration_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        lock_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        state:
          const: ready
    ListSessionsResult:
      type: object
      additionalProperties: false
      required:
        - sessions
      properties:
        sessions:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/SessionSummary'
        next_before_session_id:
          type: string
          format: uuid
    SessionSummary:
      type: object
      additionalProperties: false
      required:
        - session_id
        - state
        - created_at
      properties:
        session_id:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/SessionState'
        created_at:
          type: string
          format: date-time
        terminal_at:
          type: string
          format: date-time
    SessionStateResult:
      type: object
      additionalProperties: false
      required:
        - session_id
        - state
        - last_sequence
      properties:
        session_id:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/SessionState'
        last_sequence:
          type: integer
          minimum: 1
        pending_approval_id:
          type: string
          format: uuid
        uncertain_attempt_id:
          type: string
          format: uuid
    AttachSessionResult:
      type: object
      additionalProperties: false
      required:
        - session_id
        - state
        - replay_after_sequence
        - last_sequence
      properties:
        session_id:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/SessionState'
        replay_after_sequence:
          type: integer
          minimum: 0
        last_sequence:
          type: integer
          minimum: 1
    PromptResult:
      type: object
      additionalProperties: false
      required:
        - input_id
        - sequence
      properties:
        input_id:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
    ControlResult:
      type: object
      additionalProperties: false
      required:
        - control_id
        - control
        - state
      properties:
        control_id:
          type: string
          format: uuid
        control:
          enum:
            - pause
            - resume
            - redirect
            - cancel
        state:
          $ref: '#/components/schemas/SessionState'
    ApprovalResult:
      type: object
      additionalProperties: false
      required:
        - approval_id
        - decision
        - state
      properties:
        approval_id:
          type: string
          format: uuid
        decision:
          enum:
            - grant
            - deny
        state:
          $ref: '#/components/schemas/SessionState'
    ReconciliationResult:
      type: object
      additionalProperties: false
      required:
        - attempt_id
        - resolution
        - state
      properties:
        attempt_id:
          type: string
          format: uuid
        resolution:
          enum:
            - retry
            - accept_result
            - abandon
        replacement_attempt_id:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/SessionState'
    ExportResult:
      type: object
      additionalProperties: false
      required:
        - export_id
        - format
        - recipient_fingerprints
      properties:
        export_id:
          type: string
          format: uuid
        format:
          const: age-v1
        recipient_fingerprints:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
    DeleteResult:
      type: object
      additionalProperties: false
      required:
        - deletion_id
        - state
      properties:
        deletion_id:
          type: string
          format: uuid
        state:
          enum:
            - deleting
            - deleted
    SessionState:
      enum:
        - ready
        - running
        - pausing
        - paused
        - awaiting_clarification
        - awaiting_approval
        - cancel_requested
        - outcome_unknown
        - completed
        - failed
        - cancelled
        - abandoned
        - deleting
    ProtocolError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - retryable
        - correlation_id
      properties:
        code:
          enum:
            - invalid_request
            - unsupported_version
            - frame_too_large
            - unauthorized_peer
            - session_not_found
            - invalid_transition
            - capability_unavailable
            - policy_denied
            - approval_required
            - provider_unavailable
            - provider_timeout
            - outcome_unknown
            - client_lagged
            - storage_unavailable
            - key_store_unavailable
            - internal
        message:
          type: string
          minLength: 1
          maxLength: 512
        retryable:
          type: boolean
        correlation_id:
          type: string
          format: uuid
    SessionEvent:
      type: object
      additionalProperties: false
      required:
        - protocol
        - event_id
        - session_id
        - sequence
        - kind
        - occurred_at
        - data
      properties:
        protocol:
          const: workbench/1
        event_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
        causation_request_id:
          type: string
          format: uuid
        kind:
          enum:
            - session_created
            - configuration_resolved
            - input_recorded
            - routing_planned
            - clarification_requested
            - approval_requested
            - approval_recorded
            - dispatch_planned
            - dispatch_started
            - dispatch_acknowledged
            - provider_event
            - tool_event
            - pause_requested
            - session_paused
            - session_resumed
            - session_redirected
            - cancel_requested
            - cancel_confirmed
            - outcome_unknown
            - outcome_reconciled
            - session_completed
            - session_failed
            - session_cancelled
            - session_abandoned
            - session_exported
            - session_deletion_requested
            - session_deleted
            - workflow_transition
        occurred_at:
          type: string
          format: date-time
        data:
          type: object
    Reconciliation:
      type: object
      additionalProperties: false
      required:
        - attempt_id
        - resolution
      properties:
        attempt_id:
          type: string
          format: uuid
        resolution:
          enum:
            - retry
            - accept_result
            - abandon
        evidence:
          type: string
          maxLength: 4096
    ApprovalParams:
      type: object
      additionalProperties: false
      required:
        - approval_id
        - decision
      properties:
        approval_id:
          type: string
          format: uuid
        decision:
          enum:
            - grant
            - deny
    InitializeParams:
      type: object
      additionalProperties: false
      required:
        - client_name
        - client_version
        - supported_protocols
      properties:
        client_name:
          type: string
          minLength: 1
          maxLength: 128
        client_version:
          type: string
          minLength: 1
          maxLength: 128
        supported_protocols:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            maxLength: 32
    CreateSessionParams:
      type: object
      additionalProperties: false
      required:
        - persistent
      properties:
        persistent:
          const: true
        configuration_overrides:
          type: object
        workflow:
          type: string
          minLength: 1
          maxLength: 63
          pattern: '^[a-z][a-z0-9-]{0,62}$'
          description: Optional declarative workflow id executed by the daemon
    ListSessionsParams:
      type: object
      additionalProperties: false
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
        before_session_id:
          type: string
          format: uuid
    AttachSessionParams:
      type: object
      additionalProperties: false
      required:
        - after_sequence
      properties:
        after_sequence:
          type: integer
          minimum: 0
    PromptParams:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1048576
        explicit_target:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,62}$'
    EmptyParams:
      type: object
      maxProperties: 0
    RedirectParams:
      type: object
      additionalProperties: false
      required:
        - instruction
      properties:
        instruction:
          type: string
          minLength: 1
          maxLength: 1048576
    ExportParams:
      type: object
      additionalProperties: false
      required:
        - output_path
        - age_recipients
      properties:
        output_path:
          type: string
          minLength: 1
          maxLength: 4096
        age_recipients:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 512
    DeleteParams:
      type: object
      additionalProperties: false
      required:
        - confirm_session_id
      properties:
        confirm_session_id:
          type: string
          format: uuid
x-workbench-framing:
  encoding: newline-delimited-json
  maxFrameBytes: 8388608
  maxClientQueueEvents: 1024
  maxClientQueueBytes: 8388608
  delivery: at-least-once
  deduplication:
    - event_id
    - session_id
    - sequence
  commandIdempotency:
    key: request_id
    durableMethods:
      - session.create
      - session.prompt
      - session.pause
      - session.resume
      - session.redirect
      - session.cancel
      - session.approval.resolve
      - session.reconcile
      - session.export
      - session.delete
x-workbench-security:
  transport: same-user-local-ipc
  supportedPlatforms:
    - macos
    - linux
  peerVerification: required
  failureMode: fail-closed
x-workbench-parameter-schema-by-method:
  initialize: '#/components/schemas/InitializeParams'
  status.get: '#/components/schemas/EmptyParams'
  session.list: '#/components/schemas/ListSessionsParams'
  session.create: '#/components/schemas/CreateSessionParams'
  session.get: '#/components/schemas/EmptyParams'
  session.attach: '#/components/schemas/AttachSessionParams'
  session.prompt: '#/components/schemas/PromptParams'
  session.pause: '#/components/schemas/EmptyParams'
  session.resume: '#/components/schemas/EmptyParams'
  session.redirect: '#/components/schemas/RedirectParams'
  session.cancel: '#/components/schemas/EmptyParams'
  session.approval.resolve: '#/components/schemas/ApprovalParams'
  session.reconcile: '#/components/schemas/Reconciliation'
  session.export: '#/components/schemas/ExportParams'
  session.delete: '#/components/schemas/DeleteParams'
x-workbench-result-schema-by-method:
  initialize: '#/components/schemas/InitializeResult'
  status.get: '#/components/schemas/StatusResult'
  session.list: '#/components/schemas/ListSessionsResult'
  session.create: '#/components/schemas/CreateSessionResult'
  session.get: '#/components/schemas/SessionStateResult'
  session.attach: '#/components/schemas/AttachSessionResult'
  session.prompt: '#/components/schemas/PromptResult'
  session.pause: '#/components/schemas/ControlResult'
  session.resume: '#/components/schemas/ControlResult'
  session.redirect: '#/components/schemas/ControlResult'
  session.cancel: '#/components/schemas/ControlResult'
  session.approval.resolve: '#/components/schemas/ApprovalResult'
  session.reconcile: '#/components/schemas/ReconciliationResult'
  session.export: '#/components/schemas/ExportResult'
  session.delete: '#/components/schemas/DeleteResult'
